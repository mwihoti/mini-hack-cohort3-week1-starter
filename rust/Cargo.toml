[package]
name = "mini-hack-chat"
version = "1.0.0"
edition = "2021"
description = "Rust version of chat.js, a CLI chatbot with conversation memory"
publish = false

# Cargo expects src/main.rs by default. This points it at chat.rs instead.
[[bin]]
name = "chat"
path = "chat.rs"

[dependencies]
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
